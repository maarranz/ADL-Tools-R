# Runs R CMD check on every push and pull request, on Linux, macOS and
# Windows. Results: the Actions tab of the GitHub repository.
# Based on the r-lib/actions "check-standard" template.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # also allows a manual run from the Actions tab

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}   # previous R version
          # Oldest supported R, with the required dependencies only: the
          # suggested packages (dynlm -> car -> lme4 -> Matrix, ...) follow
          # current R and no longer install there; tests that need them skip.
          - os: ubuntu-latest
            r: '4.2'
            deps: '"hard"'
            extra: 'any::testthat'
            build_args: 'c("--no-manual", "--no-build-vignettes")'
            args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")'
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false   # a missing suggested package is not an error

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.deps || '"all"' }}
          extra-packages: any::rcmdcheck ${{ matrix.config.extra }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: ${{ matrix.config.build_args || 'c("--no-manual", "--compact-vignettes=gs+qpdf")' }}
          args: ${{ matrix.config.args || 'c("--no-manual", "--as-cran")' }}
